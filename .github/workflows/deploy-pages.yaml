name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to gh-pages
        run: |
          git config user.name "relentlessworks[bot]"
          git config user.email "noreply@relentlessworks.com"

          # Save docs to temp dir before switching branches
          cp -r docs /tmp/docs-backup

          # Create orphan gh-pages branch
          git checkout --orphan gh-pages
          git reset --hard

          # Copy docs content to root
          cp -r /tmp/docs-backup/* .
          rm -rf /tmp/docs-backup

          # Commit and push
          git add .
          git commit -m "Deploy docs to gh-pages"
          git push origin gh-pages --force
