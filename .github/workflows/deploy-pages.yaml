name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages
        run: |
          git config user.name "relentlessworks[bot]"
          git config user.email "noreply@relentlessworks.com"
          git checkout --orphan gh-pages
          git reset --hard
          cp -r docs/* .
          git add .
          git commit -m "Deploy docs to gh-pages"
          git push origin gh-pages --force
